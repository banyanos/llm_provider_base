[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-base"
version = "1.0.0"
description = "BanyanOS llm_engine provider plugin base (ProviderContext, host hooks, plugin metadata)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ideabosque" },
]
dependencies = [

]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_provider_base*"]

[tool.setuptools.package-data]
llm_provider_base = ["*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
